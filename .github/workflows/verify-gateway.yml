name: Verify AHC deploy gateway code

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "gateway/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "gateway/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check gateway JavaScript syntax
        run: |
          node --check gateway/drive-snapshot.mjs
          node --check gateway/verify-production.mjs
          node --check gateway/verify-production-browser.mjs

      - name: Validate fixed deployment configuration
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const config = JSON.parse(fs.readFileSync("gateway/config.json", "utf8"));
          const expected = {
            firebaseProjectId: "at-home-church-okinawa",
            productionUrl: "https://athchurch.org",
            publicFolderName: "public"
          };
          for (const [key, value] of Object.entries(expected)) {
            if (config[key] !== value) {
              throw new Error(`Unexpected ${key}: ${config[key]}`);
            }
          }
          if (!config.driveRootFolderId) throw new Error("driveRootFolderId is missing");
          if (!Array.isArray(config.requiredRootFiles) || !config.requiredRootFiles.includes("build-morning-word-archive.mjs")) {
            throw new Error("Morning Word generator must be a required Drive root file");
          }
          if (!Array.isArray(config.requiredSourcePaths) || !config.requiredSourcePaths.includes("content/message")) {
            throw new Error("Canonical MESSAGE source tree must be included in the Drive snapshot");
          }
          NODE

      - name: Verify production trigger guardrails
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const deployText = fs.readFileSync(".github/workflows/deploy-production.yml", "utf8");
          const verifyText = fs.readFileSync(".github/workflows/verify-gateway.yml", "utf8");
          const runtimeVerifyText = fs.readFileSync("gateway/verify-production.mjs", "utf8");

          if (!/^\s{2}workflow_dispatch:/m.test(deployText)) {
            throw new Error("Production workflow must retain workflow_dispatch fallback");
          }
          if (!/^\s{2}push:/m.test(deployText)) {
            throw new Error("Production workflow must include the guarded deploy-request push trigger");
          }
          if (!deployText.includes('".deploy/production-request.json"')) {
            throw new Error("Production push trigger must be restricted to .deploy/production-request.json");
          }

          for (const forbidden of ["pull_request:", "pull_request_target:", "schedule:", "issues:", "issue_comment:"]) {
            const re = new RegExp("^\\s{2}" + forbidden, "m");
            if (re.test(deployText)) {
              throw new Error(`Forbidden production trigger found: ${forbidden}`);
            }
          }

          if (!deployText.includes("cancel-in-progress: false")) {
            throw new Error("Production concurrency must not cancel an in-progress deploy");
          }
          if (!deployText.includes('--only hosting --project "at-home-church-okinawa"')) {
            throw new Error("Hosting-only pinned Firebase deploy command is missing");
          }
          if (!deployText.includes("playwright@1.55.0")) {
            throw new Error("Pinned Playwright browser verifier dependency is missing");
          }
          if (!deployText.includes("node gateway/verify-production-browser.mjs")) {
            throw new Error("Production Chromium browser gate is missing");
          }
          for (const requiredCrawlerCheck of ["OAI-SearchBot", "ChatGPT-User", "/robots.txt", "/sitemap.xml", "AHC_CRAWLER_ACCESS_VERIFICATION_PASSED"]) {
            if (!runtimeVerifyText.includes(requiredCrawlerCheck)) {
              throw new Error(`Production crawler-access verification is missing: ${requiredCrawlerCheck}`);
            }
          }
          if (!deployText.includes("actions/upload-artifact@v4")) {
            throw new Error("Browser verification evidence upload is missing");
          }
          if (!deployText.includes('deploy -ne $true')) {
            throw new Error("Production request must require deploy=true");
          }
          if (!/^\s{2}browser_verify:/m.test(deployText) || !deployText.includes("needs: deploy")) {
            throw new Error("Browser verification must remain a separate job that depends on deploy");
          }
          const verifyTriggerText = verifyText.split(/^permissions:/m)[0];
          if (!verifyTriggerText.includes('paths:') || verifyTriggerText.includes('".deploy/production-request.json"')) {
            throw new Error("Gateway code verification must not run for production request-file updates");
          }
          NODE
